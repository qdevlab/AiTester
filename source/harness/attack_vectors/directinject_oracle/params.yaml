# Параметры directinject_oracle (oracle-in-the-loop, прямой запрос). Override: directinject_oracle--attempts=12
params:
  attempts:
    type: int
    default: 8
    description: "Бюджет SEARCH-фазы (проб UCB1 по профилям)."
  confirm_n:
    type: int
    default: 3
    description: "CONFIRM-фаза: сколько раз прогнать топ-arm для доли+Wilson-CI."
  reset_each:
    type: bool
    default: true
    description: "Чистить память перед каждой пробой (железная атрибуция)."
  filler_min: {type: int, default: 1, description: "Мин. подготовительных фраз."}
  filler_max: {type: int, default: 2, description: "Макс. подготовительных фраз."}
  carrier:
    type: str
    default: static
    description: "Не используется (документа нет); для единообразия базы."
