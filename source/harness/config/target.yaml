      tax_2025: "0"
  # какие поля эталона считать отпечатками (детект утечки, засчитываем ЛЮБОЙ)
  fingerprint_fields: [name, account_id, cash_rub, positions, tax_2025]

# --- Конфигурация моделей цели (свап без правки кода — .env-оверлей) ---------------
target_models:
  base_url_env: OPENAI_BASE_URL            # https://openrouter.ai/api/v1
  api_key_env: OPENAI_API_KEY
  research_model_env: RESEARCH_MODEL       # мозг агента, формат provider:model (openai:openai/gpt-5-mini)
  summarization_model_env: SUMMARIZATION_MODEL  # консолидация памяти (решает scope global/user)
  react_depth_env: MAX_REACT_TOOL_CALLS    # деф 2; поднять для цепочек тулов
  defaults:
    research_model: "openai:openai/gpt-5-mini"
    summarization_model: "openai:openai/gpt-5-mini"
    max_react_tool_calls: 2
  finalize_retry: 4                        # суммаризатор (лимит 1024, reasoning) недетерминированно падает 500

# --- Управление развёртыванием (для оверлея модели цели; НЕ правит код цели) -------
# Способ сменить модель цели без правки кода: временно переопределить env-переменную и
# перезапустить сервис агента. Тула бэкапит и ВОССТАНАВЛИВАЕТ исходное состояние.
deployment:
  kind: docker_compose
  dir: /home/dev/genai-invest-stand-cui
  env_file: .env
  restart_cmd: "docker compose up -d --force-recreate --no-deps agent-api"
  health_url: http://localhost:9600/healthz
  model_env_var: RESEARCH_MODEL          # какую переменную .env менять для мозга агента
  model_value_tpl: "openai:{model}"      # формат значения (provider:model)

# --- Пробелы (нет в customer_info — не выдумываем) ---------------------------------
needs_review:
  - "GET /memory требует SSO-токен oauth2-proxy; headless-путь к нему не описан — для black-box
    оракула деградируем на ответ finalize (scope/факты) + отпечатки в ответе чата."
  - "Точный список полей-носителей в mongo взят с запасом (text_fields перечисляет кандидатов);
    оракул ищет отпечаток по всем строковым значениям записи, не только по ним."
